<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <a class="pular-conteudo" href="#lista">Pular para a lista de filmes</a>

    <header>
        <h1>CineTrack</h1>

        <form class="barra-busca" role="search" id="form-busca">
            <label for="busca" class="somente-leitor">Buscar filme por título</label>
            <input type="search" id="busca" class="caixa-texto" placeholder="Buscar filme" autocomplete="off">
            <button type="button" id="btn-adicionar" class="botao-adicionar">+ Adicionar</button>
        </form>
    </header>

    <nav aria-label="Navegação principal">
        <ul>
            <li><a href="index.html" aria-current="page">Início</a></li>
            <li><a href="sobre.html">Sobre</a></li>
        </ul>
    </nav>

    <main>
        <div class="filtros" role="group" aria-label="Filtrar por status">
            <button type="button" class="botao-ativo" data-status="todos" aria-pressed="true">Todos</button>
            <button type="button" class="botao-inativo" data-status="assistido" aria-pressed="false">Assistido</button>
            <button type="button" class="botao-inativo" data-status="assistindo" aria-pressed="false">Assistindo</button>
            <button type="button" class="botao-inativo" data-status="quero" aria-pressed="false">Quero assistir</button>
        </div>

        <p id="resumo" class="resumo" role="status"></p>

        <section id="lista" aria-label="Lista de filmes">
            <!-- Os cards são gerados pelo app.js a partir dos dados. -->
        </section>
    </main>

    <dialog id="modal" aria-labelledby="modal-titulo">
        <form id="form-filme">
            <h2 id="modal-titulo">Adicionar filme</h2>

            <div class="campo">
                <label for="titulo">Título</label>
                <input id="titulo" name="titulo" class="caixa-texto" type="text" required maxlength="120" aria-describedby="erro-titulo">
                <p class="erro" id="erro-titulo" role="alert"></p>
            </div>

            <div class="campo">
                <label for="ano">Ano</label>
                <input id="ano" name="ano" class="caixa-texto" type="number" min="1888" max="2030" required aria-describedby="erro-ano">
                <p class="erro" id="erro-ano" role="alert"></p>
            </div>

            <div class="campo">
                <label for="genero">Gênero</label>
                <input id="genero" name="genero" class="caixa-texto" type="text" required maxlength="60" aria-describedby="erro-genero">
                <p class="erro" id="erro-genero" role="alert"></p>
            </div>

            <div class="campo">
                <label for="poster">URL do pôster (opcional)</label>
                <input id="poster" name="poster" class="caixa-texto" type="text" inputmode="url" placeholder="https://..." aria-describedby="erro-poster">
                <p class="erro" id="erro-poster" role="alert"></p>
            </div>

            <div class="campo">
                <label for="status">Status</label>
                <select id="status" name="status" class="caixa-texto" required aria-describedby="erro-status">
                    <option value="assistido">Assistido</option>
                    <option value="assistindo">Assistindo</option>
                    <option value="quero">Quero assistir</option>
                </select>
                <p class="erro" id="erro-status" role="alert"></p>
            </div>

            <div class="campo">
                <label for="nota">Nota (1 a 5)</label>
                <input id="nota" name="nota" class="caixa-texto" type="number" min="1" max="5" step="1" required aria-describedby="erro-nota">
                <p class="erro" id="erro-nota" role="alert"></p>
            </div>

            <div class="campo">
                <label for="comentario">Comentário (opcional)</label>
                <textarea id="comentario" name="comentario" class="caixa-texto" rows="4" maxlength="500" aria-describedby="erro-comentario"></textarea>
                <p class="erro" id="erro-comentario" role="alert"></p>
            </div>

            <div class="acoes-form">
                <button type="submit" class="botao-salvar">Salvar</button>
                <button type="button" class="botao-cancelar" id="btn-cancelar">Cancelar</button>
            </div>
        </form>
    </dialog>

    <footer>
        <p>CineTrack - UEM</p>
        <a href="sobre.html">Sobre - CineTrack</a>
    </footer>
</body>
</html>
